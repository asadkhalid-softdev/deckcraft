[package]
name = "deckcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-media = { workspace = true }
egui = { workspace = true }
egui_commonmark = { version = "0.25", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
tempfile = "3"
fs2 = "0.4"
zeroize = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
webbrowser = "1"
zip = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
rsa = { version = "0.9", features = ["getrandom"] }

egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
